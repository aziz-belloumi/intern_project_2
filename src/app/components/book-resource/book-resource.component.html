<div class="book-resource-section">
  <h2 class="section-title">Book a Resource</h2>
  
  <div class="booking-form-container">
    <form class="booking-form" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="resourceName" class="form-label">Resource Name</label>
          <select 
            id="resourceName"
            name="resourceName"
            class="form-control"
            required>
            <option value="">Select a resource</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="date" class="form-label">Date</label>
          <input 
            type="date" 
            id="date"
            name="date"
            class="form-control"
            required>
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="timeSlot" class="form-label">Time Slot</label>
          <select 
            id="timeSlot"
            name="timeSlot"
            class="form-control"
            required>
            <option value="">Select time slot</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="comments" class="form-label">Comments</label>
          <textarea 
            id="comments"
            name="comments"
            class="form-control"
            placeholder="Additional comments or requirements"
            rows="3"></textarea>
        </div>
      </div>
      
      <div class="form-actions">
        <button 
          type="submit" 
          class="btn btn-primary"
          [disabled]="!isFormValid()">
          Book Now
        </button>
      </div>
    </form>
  </div>
</div>
