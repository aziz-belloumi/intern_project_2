<header class="header">
  <div class="header-content">
    <div class="logo-section">
      <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="7" height="7" rx="1" fill="#4f46e5"/>
          <rect x="14" y="3" width="7" height="7" rx="1" fill="#4f46e5"/>
          <rect x="3" y="14" width="7" height="7" rx="1" fill="#4f46e5"/>
          <rect x="14" y="14" width="7" height="7" rx="1" fill="#4f46e5"/>
        </svg>
      </div>
      <h1 class="logo-text">Resource Manager</h1>
    </div>
    
    <nav class="navigation">
      <ul class="nav-list">
        <li *ngFor="let item of navigationItems" class="nav-item" 
            [class.active]="item.active">
          <a [routerLink]="item.route"  routerLinkActive="active-link" class="nav-link">{{ item.label }}</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
