<div class="dashboard-cards">
  <h2 class="section-title">Dashboard</h2>
  
  <div class="cards-grid">
    <!-- Available Rooms Card -->
    <div class="card rooms-card" (click)="onViewRooms()">
      <h3 class="card-title">Available Rooms</h3>
      <div class="card-content">
        <div class="rooms-illustration">
          <svg width="120" height="100" viewBox="0 0 120 100" fill="none">
            <!-- Building illustration -->
            <rect x="10" y="20" width="100" height="70" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
            <!-- Windows -->
            <rect x="20" y="30" width="15" height="15" fill="#60a5fa" stroke="#3b82f6"/>
            <rect x="45" y="30" width="15" height="15" fill="#fbbf24" stroke="#f59e0b"/>
            <rect x="70" y="30" width="15" height="15" fill="#60a5fa" stroke="#3b82f6"/>
            <rect x="95" y="30" width="10" height="15" fill="#34d399" stroke="#10b981"/>
            
            <rect x="20" y="55" width="15" height="15" fill="#f87171" stroke="#ef4444"/>
            <rect x="45" y="55" width="15" height="15" fill="#60a5fa" stroke="#3b82f6"/>
            <rect x="70" y="55" width="15" height="15" fill="#34d399" stroke="#10b981"/>
            <rect x="95" y="55" width="10" height="15" fill="#fbbf24" stroke="#f59e0b"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Equipment Status Card -->
    <div class="card equipment-card" (click)="onViewEquipment()">
      <h3 class="card-title">Equipment Status</h3>
      <div class="card-content">
        <div class="equipment-illustration">
          <svg width="120" height="100" viewBox="0 0 120 100" fill="none">
            <!-- Equipment illustration -->
            <rect x="15" y="25" width="25" height="50" fill="#6b7280" stroke="#374151" stroke-width="1"/>
            <rect x="50" y="20" width="20" height="55" fill="#6b7280" stroke="#374151" stroke-width="1"/>
            <rect x="80" y="30" width="30" height="40" fill="#6b7280" stroke="#374151" stroke-width="1"/>
            
            <!-- Status indicators -->
            <circle cx="27" cy="35" r="3" fill="#10b981"/>
            <circle cx="60" cy="30" r="3" fill="#f59e0b"/>
            <circle cx="95" cy="40" r="3" fill="#ef4444"/>
            
            <!-- Details -->
            <rect x="20" y="45" width="15" height="8" fill="#374151"/>
            <rect x="55" y="40" width="10" height="12" fill="#374151"/>
            <rect x="85" y="50" width="20" height="10" fill="#374151"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
