<div>
  <h2 class="section-title">Resource Overview</h2>

  <div class="carousel-container">
    <button class="carousel-btn prev" (click)="scrollLeft()">&#10094;</button>

    <section class="dots-container" *ngIf="roomsLoading$ | async">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </section>

    <div class="cards-wrapper" #cardsWrapper *ngIf="!(roomsLoading$ | async) && (rooms$ | async) as rooms">
      <div
        *ngFor="let room of rooms"
        class="flip-card"
      >
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <p class="title">Room {{ room.id }}</p>
            <p class="subtitle">{{ room.roomType | titlecase }}</p>
            <div class="capacity-badge">
              <span class="capacity-number">{{ room.capacity }}</span>
              <span class="capacity-label">People</span>
            </div>
          </div>
          <div class="flip-card-back">
            <p class="title">Details</p>
            <div class="room-details">
              <div class="detail-item">
                <span class="detail-label">Capacity:</span>
                <span class="detail-value">{{ room.capacity }} people</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Price/min:</span>
                <span class="detail-value">${{ room.pricePerMinute }}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Type:</span>
                <span class="detail-value">{{ room.roomType | titlecase }}</span>
              </div>
              <div class="detail-item" *ngIf="room.hasProjector">
                <span class="feature-badge">Projector</span>
              </div>
              <div class="detail-item" *ngIf="room.hasWhiteboard">
                <span class="feature-badge">Whiteboard</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <button class="carousel-btn next" (click)="scrollRight()">&#10095;</button>
  </div>
</div>
