<div class="resource-overview">
  <h2 class="section-title">Resource Overview</h2>

  <div class="carousel-container">
    <button class="carousel-btn prev" (click)="scrollLeft()">&#10094;</button>
    <section class="dots-container" *ngIf="roomsLoading$ | async">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </section>
    <div class="cards-wrapper" #cardsWrapper *ngIf="!(roomsLoading$ | async) && (rooms$ | async) as rooms">
      <div
        *ngFor="let room of rooms"
        class="resource-card"
      >
        <div class="card-icon">
          <i>Room {{ room.id }}</i>
        </div>

        <div class="card-content">
          <h3 class="card-title">capacity : {{ room.capacity }}</h3>
          <div class="card-count">price per minute : {{ room.pricePerMinute }}</div>
          <div class="card-subtitle">type of room : {{ room.roomType }}</div>
        </div>
      </div>
    </div>

    <button class="carousel-btn next" (click)="scrollRight()">&#10095;</button>
  </div>
</div>
