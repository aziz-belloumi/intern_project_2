<div
  class="popup-overlay"
  *ngIf="isVisible"
  [@fadeInOut]="isVisible ? 'in' : 'out'"
  (click)="close()">
  <div class="popup-container" (click)="$event.stopPropagation()">
    <div class="popup-content">
      <div class="popup-header">
        <h3 class="popup-title">Reserve Room</h3>
        <button class="popup-close-btn" (click)="close()">
          {{ closeButtonText }}
        </button>
      </div>

      <div class="popup-body">
        <div class="room-details-section">

          <div class="detail-row">
            <span class="detail-label">Purpose:</span>
            <input type="text" [(ngModel)]="purpose" class="popup-input" placeholder="Enter purpose" required />
          </div>

          <div class="detail-row">
            <span class="detail-label">Attendees:</span>
            <input type="number" [(ngModel)]="attendees" class="popup-input" min="1" [max]="roomCapacity" required/>
          </div>

          <div class="detail-row">
            <span class="detail-label">Start Time:</span>
            <input type="datetime-local" [(ngModel)]="startTime" class="popup-input" required/>
          </div>

          <div class="detail-row">
            <span class="detail-label">End Time:</span>
            <input type="datetime-local" [(ngModel)]="endTime" class="popup-input" required/>
          </div>

          <div class="popup-actions">
            <button class="confirm-btn" (click)="confirmBooking()">Confirm</button>
            <button class="cancel-btn" (click)="close()">Cancel</button>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
