<div class="resource-table-container">
  <h2 class="section-title">Rooms</h2>

  <div class="table-wrapper" *ngIf="rooms$ | async as rooms">
    <table class="resource-table">
      <thead>
      <tr>
        <th>Room</th>
        <th>Capacity</th>
        <th>Availability</th>
        <th>Message</th>
        <th>Reserve</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let room of rooms">
        <td>Room {{ room.roomId }}</td>
        <td>{{ room.capacity }}</td>
        <td>
            <span class="availability-badge">
              {{ getStatusIcon(room.status) }} {{ getStatusText(room.status) }}
            </span>
        </td>
        <td>{{ room.message }}</td>
        <td>
          <button
            class="reserve-btn"
            [disabled]="room.status.toLowerCase() !== 'available'"
            [ngStyle]="{
                'background-color': room.status.toLowerCase() === 'available' ? '#0056b3' : '#888',
                color: '#fff',
                cursor: room.status.toLowerCase() === 'available' ? 'pointer' : 'not-allowed'
              }"
            (click)="reserveRoom(room)"
          >
            Reserve
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
