<div class="resource-table-container">
  <h2 class="section-title">Rooms</h2>

  <div class="table-wrapper">
    <table class="resource-table">
      <thead>
      <tr>
        <th>Resource Name</th>
        <th>Capacity</th>
        <th>Availability</th>
        <th>Last Updated</th>
        <th>Reserve</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let resource of resources" class="table-row">
        <td class="resource-cell">
          <div class="resource-info">
            <div class="resource-icon">
              <i>{{ resource.icon }}</i>
            </div>
            <span class="resource-name">{{ resource.name }}</span>
          </div>
        </td>

        <td class="capacity-cell">
          {{ resource.capacity }}
        </td>

        <td class="availability-cell">
                <span
                  class="availability-badge"
                  [ngClass]="'availability-' + resource.availability"
                >
                  <i class="status-icon">{{ getStatusIcon(resource.availability) }}</i>
                  {{ getStatusText(resource.availability) }}
                </span>
          <span *ngIf="resource.assignedTo" class="assigned-to">
                  {{ resource.assignedTo }}
                </span>
        </td>

        <td class="date-cell">
          {{ formatDate(resource.lastUpdated) }}
        </td>

        <td class="action-cell">
          <button
            class="reserve-btn"
            [disabled]="resource.availability === 'reserved'"
            (click)="reserveResource(resource)"
          >
            <i>📅</i>
          </button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
