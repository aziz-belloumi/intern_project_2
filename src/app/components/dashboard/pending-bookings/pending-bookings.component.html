<div class="my-rooms-container">
  <div class="explore-header">
    <p class="page-subtitle">Pending Bookings</p>
  </div>

  <!-- No Bookings Message -->
  <div *ngIf="pendingBookings.length === 0" class="no-results">
    <svg class="no-results-icon" fill="currentColor" viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
    </svg>
    <h3>No pending bookings</h3>
    <p>All bookings have been handled.</p>
  </div>

  <!-- Bookings List -->
  <div class="rooms-container list-view" *ngIf="pendingBookings.length > 0">
    <div *ngFor="let booking of pendingBookings" class="room-card">
      <div class="room-content">
        <div class="room-header">
          <h3 class="room-title">Booking #{{ booking?.id }}</h3>
          <div class="room-price">{{ booking.createdAt | date:'short' }}</div>
        </div>

        <p class="room-description">
          Room: {{ booking.roomId }}<br>
          User: {{ booking.attendees}}<br>
          Duration: {{ booking.attendees }} minutes
        </p>

        <div class="room-actions">
          <button *ngIf="booking.id !== undefined" (click)="approveBooking(booking.id)">Approve</button>
          <button *ngIf="booking.id !== undefined" (click)="rejectBooking(booking.id)">Reject</button>
        </div>
      </div>
    </div>
  </div>
</div>
