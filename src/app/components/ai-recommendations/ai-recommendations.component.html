<div class="ai-recommendations-section">
  <h2 class="section-title">Recommendations</h2>
  
  <div class="recommendations-grid">
    <!-- Optimal Time Slots Card -->
    <div class="recommendation-card optimal-times-card" (click)="onViewOptimalTimes()">
      <h3 class="card-title">Optimal Time Slots</h3>
      <div class="card-content">
        <div class="chart-container">
          <svg width="140" height="80" viewBox="0 0 140 80">
            <!-- Chart background -->
            <rect x="10" y="10" width="120" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
            
            <!-- Bar chart -->
            <rect x="20" y="50" width="8" height="15" fill="#ef4444"/>
            <rect x="35" y="45" width="8" height="20" fill="#f59e0b"/>
            <rect x="50" y="35" width="8" height="30" fill="#10b981"/>
            <rect x="65" y="25" width="8" height="40" fill="#3b82f6"/>
            <rect x="80" y="30" width="8" height="35" fill="#6366f1"/>
            <rect x="95" y="40" width="8" height="25" fill="#8b5cf6"/>
            <rect x="110" y="55" width="8" height="10" fill="#ef4444"/>
            
            <!-- Time labels -->
            <text x="22" y="78" fill="#6b7280" font-size="8">9</text>
            <text x="37" y="78" fill="#6b7280" font-size="8">10</text>
            <text x="52" y="78" fill="#6b7280" font-size="8">11</text>
            <text x="67" y="78" fill="#6b7280" font-size="8">12</text>
            <text x="82" y="78" fill="#6b7280" font-size="8">1</text>
            <text x="97" y="78" fill="#6b7280" font-size="8">2</text>
            <text x="112" y="78" fill="#6b7280" font-size="8">3</text>
          </svg>
        </div>
      </div>
    </div>

    <!-- Potential Conflicts Card -->
    <div class="recommendation-card conflicts-card" (click)="onViewConflicts()">
      <h3 class="card-title">Potential Conflicts</h3>
      <div class="card-content">
        <div class="conflicts-illustration">
          <svg width="140" height="80" viewBox="0 0 140 80">
            <!-- World map background -->
            <rect x="10" y="10" width="120" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
            
            <!-- Continents simplified -->
            <path d="M25 25 L45 25 L45 45 L25 45 Z" fill="#60a5fa"/>
            <path d="M55 20 L85 20 L85 50 L55 50 Z" fill="#60a5fa"/>
            <path d="M95 30 L115 30 L115 55 L95 55 Z" fill="#60a5fa"/>
            
            <!-- Conflict indicators -->
            <circle cx="35" cy="35" r="3" fill="#ef4444"/>
            <circle cx="70" cy="35" r="3" fill="#f59e0b"/>
            <circle cx="105" cy="42" r="3" fill="#ef4444"/>
            
            <!-- People icons -->
            <circle cx="30" cy="45" r="2" fill="#374151"/>
            <circle cx="40" cy="45" r="2" fill="#374151"/>
            <circle cx="75" cy="45" r="2" fill="#374151"/>
            <circle cx="100" cy="50" r="2" fill="#374151"/>
            <circle cx="110" cy="50" r="2" fill="#374151"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Usage Insights Card -->
    <div class="recommendation-card insights-card" (click)="onViewUsageInsights()">
      <h3 class="card-title">Usage Insights</h3>
      <div class="card-content">
        <div class="insights-chart">
          <svg width="140" height="80" viewBox="0 0 140 80">
            <!-- Chart background -->
            <rect x="10" y="10" width="120" height="60" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1"/>
            
            <!-- Line chart -->
            <polyline 
              points="20,55 35,45 50,35 65,25 80,30 95,20 110,40 125,30" 
              fill="none" 
              stroke="#0ea5e9" 
              stroke-width="2"/>
            
            <!-- Data points -->
            <circle cx="20" cy="55" r="2" fill="#0ea5e9"/>
            <circle cx="35" cy="45" r="2" fill="#0ea5e9"/>
            <circle cx="50" cy="35" r="2" fill="#0ea5e9"/>
            <circle cx="65" cy="25" r="2" fill="#0ea5e9"/>
            <circle cx="80" cy="30" r="2" fill="#0ea5e9"/>
            <circle cx="95" cy="20" r="2" fill="#0ea5e9"/>
            <circle cx="110" cy="40" r="2" fill="#0ea5e9"/>
            <circle cx="125" cy="30" r="2" fill="#0ea5e9"/>
            
            <!-- Trend indicators -->
            <circle cx="125" cy="25" r="4" fill="#10b981" opacity="0.7"/>
            <text x="122" y="28" fill="white" font-size="6">↑</text>
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
