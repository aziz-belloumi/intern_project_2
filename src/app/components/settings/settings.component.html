<div class="page-container">
  <main class="main-content">
    <div class="explore-container">

      <!-- Page Header -->
      <div class="explore-header">
        <p class="page-subtitle">Manage your account settings and preferences</p>
      </div>

      <!-- Settings Section -->
      <div class="search-section">
        <div class="section-title">
          <mat-icon class="section-icon">person</mat-icon>
          <h2>Personal Information</h2>
        </div>

        <form class="settings-form">
          <div class="form-row">
            <div class="filter-group">
              <label class="filter-label">First Name</label>
              <input
                type="text"
                class="filter-select"
                [(ngModel)]="user.firstName"
                name="firstName"
                placeholder="Enter your first name"
              />
            </div>

            <div class="filter-group">
              <label class="filter-label">Last Name</label>
              <input
                type="text"
                class="filter-select"
                [(ngModel)]="user.lastName"
                name="lastName"
                placeholder="Enter your last name"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="filter-group full-width">
              <label class="filter-label">Email Address</label>
              <input
                type="email"
                class="filter-select"
                [(ngModel)]="user.email"
                name="email"
                placeholder="Enter your email"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="filter-group full-width">
              <label class="filter-label">Phone Number</label>
              <input
                type="tel"
                class="filter-select"
                [(ngModel)]="user.phoneNumber"
                name="phoneNumber"
                placeholder="Enter your phone number"
              />
            </div>
          </div>
        </form>
      </div>

      <!-- Preferred Rooms Section -->
      <div class="search-section">
        <div class="section-title">
          <mat-icon class="section-icon">favorite</mat-icon>
          <h2>Preferred Rooms</h2>
        </div>

        <div class="filter-group">
          <label class="filter-label">Preferred Room IDs (comma-separated)</label>
          <textarea
            class="filter-textarea"
            [(ngModel)]="user.preferredRoomIds"
            name="preferredRoomIds"
            placeholder="e.g., 101, 205, 308"
            rows="3"
          ></textarea>
          <span class="helper-text">Enter room IDs separated by commas</span>
        </div>
      </div>

      <!-- Password Section -->
      <div class="search-section">
        <div class="section-title">
          <mat-icon class="section-icon">lock</mat-icon>
          <h2>Change Password</h2>
        </div>

        <form class="settings-form">
          <div class="form-row">
            <div class="filter-group full-width">
              <label class="filter-label">Current Password</label>
              <input
                type="password"
                class="filter-select"
                [(ngModel)]="currentPassword"
                name="currentPassword"
                placeholder="Enter current password"
              />
            </div>
          </div>

          <div class="form-row">
            <div class="filter-group">
              <label class="filter-label">New Password</label>
              <input
                type="password"
                class="filter-select"
                [(ngModel)]="newPassword"
                name="newPassword"
                placeholder="Enter new password"
              />
            </div>

            <div class="filter-group">
              <label class="filter-label">Confirm New Password</label>
              <input
                type="password"
                class="filter-select"
                [(ngModel)]="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm new password"
              />
            </div>
          </div>
        </form>
      </div>

      <!-- Notification Preferences -->
      <div class="search-section">
        <div class="section-title">
          <mat-icon class="section-icon">notifications</mat-icon>
          <h2>Notification Preferences</h2>
        </div>

        <div class="equipment-filters notification-options">
          <label class="equipment-filter">
            <input type="checkbox" [(ngModel)]="emailNotifications" />
            <span class="equipment-label">Email Notifications</span>
          </label>
          <label class="equipment-filter">
            <input type="checkbox" [(ngModel)]="smsNotifications" />
            <span class="equipment-label">SMS Notifications</span>
          </label>
          <label class="equipment-filter">
            <input type="checkbox" [(ngModel)]="bookingReminders" />
            <span class="equipment-label">Booking Reminders</span>
          </label>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="results-info action-buttons">
        <div class="button-group">
          <button class="btn btn-outline cancel-btn" (click)="cancelChanges()">
            <svg fill="currentColor" viewBox="0 0 24 24">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
            Cancel
          </button>
          <button class="btn btn-primary save-btn" (click)="saveChanges()">
            <svg fill="currentColor" viewBox="0 0 24 24">
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
            Save Changes
          </button>
        </div>
      </div>

      <!-- Account Actions -->
      <div class="account-actions">
        <button class="danger-link" (click)="deleteAccount()">
          <svg fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
          </svg>
          Delete Account
        </button>
      </div>

    </div>
  </main>
</div>
