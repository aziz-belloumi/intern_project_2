<div class="auth-container">
  <div class="auth-card">
    <h2>Sign Up</h2>

    <form (ngSubmit)="onSubmit()" #signupForm="ngForm">

      <div class="name-fields">
        <input type="text" placeholder="First Name" name="firstName" [(ngModel)]="firstName" required />
        <input type="text" placeholder="Last Name" name="lastName" [(ngModel)]="lastName" required />
      </div>

      <input type="email" placeholder="Email Address" name="email" [(ngModel)]="email" required />
      <input type="tel" placeholder="Phone Number" name="phone" [(ngModel)]="phone" required />
      <input type="password" placeholder="Password" name="password" [(ngModel)]="password" required />
      <input type="password" placeholder="Confirm Password" name="confirmPassword" [(ngModel)]="confirmPassword" required />

      <button type="submit">Sign Up</button>
    </form>
  </div>
</div>
